AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CleanHour - moves school outdoor time into the cleanest hour of the day.

Parameters:
  ModelId:
    Type: String
    Default: us.amazon.nova-2-lite-v1:0
    Description: Bedrock model (or inference profile) used by the Strands agent.
  BedrockRegion:
    Type: String
    Default: us-east-1
  PrincipalEmail:
    Type: String
    Default: ""
    Description: Optional. Gets the 5:30 AM "plan ready" email (confirm the SNS subscription once).
  SiteUrl:
    Type: String
    Default: ""
    Description: Public URL of the frontend, used for the approve link in emails.

Conditions:
  HasEmail: !Not [!Equals [!Ref PrincipalEmail, ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    CodeUri: backend/
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        TABLE_NAME: !Ref Table
        VOICE_BUCKET: !Ref VoiceBucket
        MODEL_ID: !Ref ModelId
        BEDROCK_REGION: !Ref BedrockRegion
        LLM_MODE: auto
        TOPIC_ARN: !Ref PlanReadyTopic
        SITE_URL: !Ref SiteUrl
        POWERTOOLS_SERVICE_NAME: cleanhour
        POWERTOOLS_METRICS_NAMESPACE: CleanHour

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  VoiceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-voice-notes, Status: Enabled, ExpirationInDays: 30 }

  PlanReadyTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: CleanHour

  PrincipalSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref PlanReadyTopic
      Protocol: email
      Endpoint: !Ref PrincipalEmail

  # Staff identity. Roles and school live in custom attributes; Cedar (authz.cedar) decides authority.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: cleanhour-staff
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireLowercase: true, RequireUppercase: true, RequireNumbers: true, RequireSymbols: true }
      Schema:
        - { Name: role, AttributeDataType: String, Mutable: true }
        - { Name: school, AttributeDataType: String, Mutable: true }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: cleanhour-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 8
      TokenValidityUnits: { IdToken: hours }
      ReadAttributes: [email, name, custom:role, custom:school]
      WriteAttributes: [name]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cleanhour.api.handler
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref DailyPlan
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3ReadPolicy: { BucketName: !Ref VoiceBucket }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt DailyPlan.Name }
        - Statement:
            - Effect: Allow
              Action: [states:SendTaskSuccess, states:StopExecution]
              Resource: "*"
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"
            - Effect: Allow
              Action: [polly:SynthesizeSpeech]
              Resource: "*"
      Events:
        Staff:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/api/{proxy+}", Method: ANY }
        Parents:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/api/public/{proxy+}", Method: GET, Auth: { Authorizer: NONE } }
        Health:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /api/health, Method: GET, Auth: { Authorizer: NONE } }

  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cleanhour.workflow.plan_task
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt PlanReadyTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: "*"

  WaitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cleanhour.workflow.wait_task
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }

  PublishFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cleanhour.workflow.publish_task
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref VoiceBucket }
        - Statement:
            - Effect: Allow
              Action: [polly:SynthesizeSpeech]
              Resource: "*"

  SchedulerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cleanhour.workflow.scheduled
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref DailyPlan
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - StepFunctionsExecutionPolicy: { StateMachineName: !GetAtt DailyPlan.Name }
        - Statement:
            - Effect: Allow
              Action: [states:StopExecution]
              Resource: "*"
      Events:
        Morning:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 5 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata

  MiddayRecheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: cleanhour.workflow.midday_recheck
      Timeout: 120
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt PlanReadyTopic.TopicName }
      Events:
        Midday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(30 9,11 * * ? *)
            ScheduleExpressionTimezone: Asia/Kolkata

  DailyPlan:
    Type: AWS::Serverless::StateMachine
    Properties:
      Type: STANDARD
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref PlanFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref WaitFunction }
        - LambdaInvokePolicy: { FunctionName: !Ref PublishFunction }
      DefinitionSubstitutions:
        PlanArn: !GetAtt PlanFunction.Arn
        WaitArn: !GetAtt WaitFunction.Arn
        PublishArn: !GetAtt PublishFunction.Arn
      Definition:
        Comment: Plan the day, wait for the principal (until 6:45 AM for a 5:30 run), publish.
        StartAt: Plan
        States:
          Plan:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters: { FunctionName: "${PlanArn}", Payload.$: "$" }
            ResultSelector: { quiet.$: $.Payload.quiet }
            ResultPath: $.plan_result
            Retry:
              - { ErrorEquals: [Lambda.ServiceException, Lambda.TooManyRequestsException], MaxAttempts: 2, IntervalSeconds: 3 }
            Next: IsQuiet
          IsQuiet:
            Type: Choice
            Comment: Clean air all day means no changes, so nothing to approve.
            Choices:
              - { Variable: $.plan_result.quiet, BooleanEquals: true, Next: PublishQuiet }
            Default: WaitForApproval
          PublishQuiet:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: "${PublishArn}"
              Payload:
                school_id.$: $.school_id
                date.$: $.date
                run_id.$: $.run_id
                quiet: true
            End: true
          WaitForApproval:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke.waitForTaskToken
            Parameters:
              FunctionName: "${WaitArn}"
              Payload:
                school_id.$: $.school_id
                date.$: $.date
                run_id.$: $.run_id
                task_token.$: $$.Task.Token
            TimeoutSeconds: 4500
            ResultPath: $.approval
            Catch:
              - { ErrorEquals: [States.Timeout], ResultPath: $.timeout, Next: AutoPublish }
            Next: Publish
          Publish:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: "${PublishArn}"
              Payload:
                school_id.$: $.school_id
                date.$: $.date
                run_id.$: $.run_id
                approval.$: $.approval
                auto: false
            End: true
          AutoPublish:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: "${PublishArn}"
              Payload:
                school_id.$: $.school_id
                date.$: $.date
                run_id.$: $.run_id
                auto: true
            End: true

  # Ops: if the 5:30 AM workflow ever fails, someone hears about it before parents do.
  DailyPlanFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A CleanHour morning plan failed. Check the DailyPlan execution in Step Functions.
      Namespace: AWS/States
      MetricName: ExecutionsFailed
      Dimensions: [{ Name: StateMachineArn, Value: !Ref DailyPlan }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref PlanReadyTopic]

  ImpactDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub ${AWS::StackName}-impact
      DashboardBody: !Sub |
        {"widgets": [
          {"type": "text", "x": 0, "y": 0, "width": 24, "height": 2, "properties": {"markdown": "# CleanHour impact\nEvery 5:30 AM plan records what it changed for children. Metrics: Powertools for AWS Lambda (EMF)."}},
          {"type": "metric", "x": 0, "y": 2, "width": 8, "height": 6, "properties": {"title": "PE periods moved to cleaner/cooler hours", "region": "${AWS::Region}", "stat": "Sum", "period": 86400, "view": "timeSeries",
            "metrics": [["CleanHour", "PEPeriodsMoved", "service", "cleanhour"], [".", "PEPeriodsIndoor", ".", "."], [".", "HeatMoves", ".", "."]]}},
          {"type": "metric", "x": 8, "y": 2, "width": 8, "height": 6, "properties": {"title": "Asthma-watch children kept indoors", "region": "${AWS::Region}", "stat": "Sum", "period": 86400, "view": "timeSeries",
            "metrics": [["CleanHour", "AsthmaKidsKeptIn", "service", "cleanhour"]]}},
          {"type": "metric", "x": 16, "y": 2, "width": 8, "height": 6, "properties": {"title": "Estimated PM2.5 dose cut (%)", "region": "${AWS::Region}", "stat": "Average", "period": 86400, "view": "timeSeries",
            "metrics": [["CleanHour", "DoseReductionPercent", "service", "cleanhour"]]}},
          {"type": "metric", "x": 0, "y": 8, "width": 12, "height": 6, "properties": {"title": "Morning workflow (Step Functions)", "region": "${AWS::Region}", "stat": "Sum", "period": 3600,
            "metrics": [["AWS/States", "ExecutionsSucceeded", "StateMachineArn", "${DailyPlan}"], [".", "ExecutionsFailed", ".", "."], [".", "ExecutionsTimedOut", ".", "."]]}},
          {"type": "metric", "x": 12, "y": 8, "width": 12, "height": 6, "properties": {"title": "Plans published / auto-published for GRAP / expired", "region": "${AWS::Region}", "stat": "Sum", "period": 86400,
            "metrics": [["CleanHour", "PlansPublished", "service", "cleanhour"], [".", "AutoPublishedForGRAP", ".", "."], [".", "PlansExpired", ".", "."]]}}
        ]}

Outputs:
  ApiUrl:
    Description: Base URL for the frontend's config.js
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  Dashboard:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-impact
  StateMachine:
    Value: !Ref DailyPlan
